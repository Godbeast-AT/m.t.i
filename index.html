<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>M.T.I - Heritage Spices of Indore</title>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  </head>
  <body>
    <div id="root">
      <div id="loading-screen" style="height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: sans-serif; background: #f9f9f9; color: #6a0e00; text-align: center; padding: 20px;">
        <h1 style="margin-bottom: 10px;">M.T.I - Loading...</h1>
        <p id="error-message" style="display: none; color: #d00; max-width: 400px; line-height: 1.5;">
          If this persists, check the browser console for "Failed to load resource" errors.
        </p>
      </div>
    </div>
    <script>
      // Show error message after 5 seconds if app hasn't loaded
      setTimeout(() => {
        const msg = document.getElementById('error-message');
        if (msg && document.getElementById('loading-screen')) {
          msg.style.display = 'block';
        }
      }, 5000);
    </script>
    <script type="module" src="/src/main.tsx" onerror="console.error('Failed to load main script. Check if base path matches repository name.')"></script>
  </body>
</html>
