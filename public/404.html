<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>M.T.I - Redirecting...</title>
    <script type="text/javascript">
      // Simple redirect for Single Page Applications on static hosts like GitHub Pages
      // This script takes the current path and redirects to the index.html
      var pathSegmentsToKeep = 0;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?p=' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
  </body>
</html>
